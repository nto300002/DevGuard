name: CI

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Generate DevGuard SARIF
        if: matrix.node-version == 22
        run: node dist/cli.js security-check --sarif > devguard.sarif
        continue-on-error: true

      - name: Upload DevGuard SARIF
        if: always() && matrix.node-version == 22
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: devguard.sarif
          category: devguard
